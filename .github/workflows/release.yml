name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  create-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v5
      - id: release
        uses: actions/github-script@v8
        with:
          script: |
            const { version } = require("./package.json");
            const tag = context.ref.startsWith("refs/tags/") ? context.ref.replace("refs/tags/", "") : `v${version}`;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Tally ${tag}`,
              body: [
                "**macOS** (Apple Silicon and Intel): `Tally_*_universal.dmg`",
                "**Windows 10/11**: `Tally_*_x64-setup.exe` or `Tally_*_x64_en-US.msi`",
                "**Linux** (64-bit): `Tally_*_amd64.AppImage` runs on most distributions; `.deb` for Ubuntu/Debian, `.rpm` for Fedora",
                "",
                "The builds are not code-signed. On macOS right-click the app → Open the first time; on Windows click More info → Run anyway.",
              ].join("\n"),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust-targets: ""
          - os: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
